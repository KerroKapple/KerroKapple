name: Generate Profile Graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: KerroKapple
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a47c5b&color_dots=#eadfd0,#d4b896,#a47c5b,#7a5a3f,#523d2a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#c9a378&color_dots=#1f1d18,#3a3025,#705839,#a07a4d,#c9a378

      # 公共实例 github-readme-activity-graph.vercel.app 已停用，改为在 CI 里本地出图
      - uses: actions/checkout@v4
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: activity-graph

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render activity graph
        working-directory: activity-graph
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 5100
        run: |
          sudo chown -R "$(id -u):$(id -g)" ../dist  # snk 为 docker action，dist 属主为 root
          npm install --no-audit --no-fund
          npx ts-node src/main.ts &
          for i in $(seq 1 60); do curl -sf localhost:5100/ >/dev/null && break; sleep 1; done
          base="localhost:5100/graph?username=KerroKapple&hide_border=true&hide_title=true&area=false"
          curl -sf -o ../dist/activity-graph.svg "$base&theme=minimal&bg_color=ffffff&color=a47c5b&line=a47c5b&point=a47c5b"
          curl -sf -o ../dist/activity-graph-dark.svg "$base&theme=react-dark&bg_color=0d1117&color=c9a378&line=c9a378&point=c9a378"
          ! grep -l "Something unexpected" ../dist/activity-graph*.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
